<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 197.5 48" role="img" aria-labelledby="eidos-logo-title">
  <title id="eidos-logo-title">eidos-ui</title>
  <!--
    eidos (εἶδος): the ideal form behind what is seen.
    The outlined square is the eidos - the abstract, ideal form.
    The solid square is its instantiation - "that which is seen".
    The diamond at its core is the ideal form still present inside
    every instance. A component library in one mark.
    Colours taken from the eidos-ui palette:
    #5c5de8 = primary-color / primary-500
    #818cf8 = primary-400
    #0f172a = gray-900
  -->
  <!-- the eidos: the abstract form -->
  <rect x="4" y="4" width="30" height="30" rx="7.5" fill="none" stroke="#818cf8" stroke-width="2.5"/>
  <!-- the instance: the form made visible, with the ideal at its core -->
