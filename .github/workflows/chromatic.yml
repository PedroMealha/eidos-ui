name: Chromatic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only `contents: read` is needed, for checkout - Chromatic authenticates with
# its own project token rather than GITHUB_TOKEN. Without this block the token
# inherits the repository default, which is broader than this workflow needs.
permissions:
  contents: read

jobs:
  chromatic:
    name: Publish Storybook to Chromatic
    # Secrets are never passed to `pull_request` runs from a forked repository,
    # so the token guard below would fail every fork PR with a red check that
    # the contributor cannot do anything about. Skip the job for those instead
    # of reporting a failure. `github.event.pull_request` is null on `push`,
    # hence the explicit event check first.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required for Chromatic TurboSnap

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A missing secret resolves to an empty string rather than an error, so
      # Chromatic fails deep in its own CLI with a large stack trace. Check it
      # up front and report only the length - never the value.
      - name: Verify the Chromatic token reached this run
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "::error::CHROMATIC_PROJECT_TOKEN is empty for this run."
            echo "Checklist:"
            echo "  1. Settings > Secrets and variables > ACTIONS > 'Repository secrets'"
            echo "     (the Codespaces and Dependabot tabs are separate stores that Actions cannot read)."
            echo "  2. The name must be exactly CHROMATIC_PROJECT_TOKEN (case-sensitive, no trailing space)."
            echo "  3. Secrets are never passed to pull_request runs from a forked repository."
            echo "     event=${{ github.event_name }} head_repo=${{ github.event.pull_request.head.repo.full_name }} base_repo=${{ github.repository }}"
            exit 1
          fi
          echo "Token is present (${#CHROMATIC_PROJECT_TOKEN} characters)."

      # Pinned to a commit SHA, not a moving tag: on a public repository a
      # floating `@latest` means an upstream compromise runs here automatically.
      # Dependabot updates SHA pins and keeps the trailing version comment
      # current. v18.7.2 matches the `chromatic` CLI version in package-lock.json.
      - name: Publish to Chromatic
        uses: chromaui/action@2a0b63f30233c48591844a46d451b9cf68128186 # v18.7.2
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
