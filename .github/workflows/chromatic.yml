name: Chromatic

# A build costs 504 stories x 2 modes = 1008 snapshots, against 5000 a month on
# the free plan - about five builds. So a push that cannot change a pixel must
# not spend one.
#
# The list is deliberately narrow. Two tempting entries are wrong, because
# `.storybook/stats-plugin.ts` reads files from disk at Vite config time and
# renders them into guide pages:
#
#   `**/*.md`     ACCESSIBILITY.md is rendered into Foundations/Accessibility
#   `scripts/**`  scripts/a11y-baseline.json feeds that same page
#
# Everything below is genuinely outside Storybook: `dev/**` is the example app
# (the stories glob is `../src/**`), and the three markdown files named here are
# the ones the plugin does *not* read.
# The two lists below are duplicated rather than shared with a YAML anchor:
# GitHub Actions does not support anchors or aliases in workflow files.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.devin/**'
      - 'dev/**'
      - '.github/**'
      - 'README.md'
      - 'GETTING_STARTED.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.devin/**'
      - 'dev/**'
      - '.github/**'
      - 'README.md'
      - 'GETTING_STARTED.md'
      - 'CHANGELOG.md'

# Only `contents: read` is needed, for checkout - Chromatic authenticates with
# its own project token rather than GITHUB_TOKEN. Without this block the token
# inherits the repository default, which is broader than this workflow needs.
permissions:
  contents: read

jobs:
  chromatic:
    name: Publish Storybook to Chromatic
    # Secrets are never passed to `pull_request` runs from a forked repository,
    # so the token guard below would fail every fork PR with a red check that
    # the contributor cannot do anything about. Skip the job for those instead
    # of reporting a failure. `github.event.pull_request` is null on `push`,
    # hence the explicit event check first.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required for Chromatic TurboSnap

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A missing secret resolves to an empty string rather than an error, so
      # Chromatic fails deep in its own CLI with a large stack trace. Check it
      # up front and report only the length - never the value.
      - name: Verify the Chromatic token reached this run
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "::error::CHROMATIC_PROJECT_TOKEN is empty for this run."
            echo "Checklist:"
            echo "  1. Settings > Secrets and variables > ACTIONS > 'Repository secrets'"
            echo "     (the Codespaces and Dependabot tabs are separate stores that Actions cannot read)."
            echo "  2. The name must be exactly CHROMATIC_PROJECT_TOKEN (case-sensitive, no trailing space)."
            echo "  3. Secrets are never passed to pull_request runs from a forked repository."
            echo "     event=${{ github.event_name }} head_repo=${{ github.event.pull_request.head.repo.full_name }} base_repo=${{ github.repository }}"
            exit 1
          fi
          echo "Token is present (${#CHROMATIC_PROJECT_TOKEN} characters)."

      # Pinned to a commit SHA, not a moving tag: on a public repository a
      # floating `@latest` means an upstream compromise runs here automatically.
      # Dependabot updates SHA pins and keeps the trailing version comment
      # current. v18.7.2 matches the `chromatic` CLI version in package-lock.json.
      - name: Publish to Chromatic
        uses: chromaui/action@2a0b63f30233c48591844a46d451b9cf68128186 # v18.7.2
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # TurboSnap: snapshot only the stories reachable from the files that
          # changed since the baseline build, rather than all 504. This is what
          # `fetch-depth: 0` above is for - it was claimed by that comment long
          # before the flag existed.
          #
          # Vite needs no plugin from Storybook 8 onwards, and because the
          # action builds the Storybook itself (rather than being handed a
          # prebuilt one) `preview-stats.json` is generated automatically - no
          # `--stats-json` required.
          #
          # `externals` is deliberately NOT set, though the stats plugin does
          # read ACCESSIBILITY.md, scripts/a11y-baseline.json and package.json
          # outside the module graph. Listing them would force a *full* 1008
          # snapshot run whenever any of them changes - and package.json changes
          # on every release. The cost of not listing them is that a derived
          # figure on a guide page (the component count, the a11y table, the
          # version chip) can go un-snapshotted until something else in its
          # graph changes. That is a missed diff on a docs page, not a wrong
          # page: the published Storybook is always built fresh.
          onlyChanged: true
